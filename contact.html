<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Bloomify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="contactstyle.css" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <span class="logo">🌸 Bloomify</span>
        </div>
        <div class="navbar-right">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="contactnew.html" class="active">Contact</a>
        </div>
    </nav>

    <section class="contact" id="contact">
        <div class="floating-petals">
            <span class="petal">🌸</span>
            <span class="petal">🌺</span>
            <span class="petal">🌼</span>
            <span class="petal">🌷</span>
            <span class="petal">🌹</span>
        </div>
        
        <div class="contact-header">
            <h2>Get In Touch</h2>
            <p class="contact-subtitle">We'd love to hear from you! 💕</p>
        </div>

        <div class="contact-info-cards">
            <div class="info-card">
                <div class="icon-wrapper">📧</div>
                <h3>Email Us</h3>
                <p>bloomify@gmail.com</p>
            </div>

            <div class="info-card">
                <div class="icon-wrapper">📱</div>
                <h3>Call Us</h3>
                <p>+62 812-3456-7890</p>
            </div>

            <div class="info-card">
                <div class="icon-wrapper">📍</div>
                <h3>Visit Us</h3>
                <p>Jl. Mawar No. 12<br>Jakarta, Indonesia</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2025 Bloomify | Crafted with 💕 for flower lovers</p>
    </footer>
</body>
</html>
